name: proctorguard
description: Cross-platform AI exam proctoring app (Flutter + Supabase + ML Kit)
publish_to: "none"
version: 1.0.0

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Backend
  supabase_flutter: ^2.5.6

  # Offline resilience: the local-first answer cache and the retry queues behind it
  shared_preferences: ^2.5.5

  # Camera / on-device AI
  camera: ^0.12.1
  # The camera plugin's platform interface, imported directly for
  # `CameraPlatform.instance.supportsImageStreaming()`. That one question is what
  # tells a platform that can hand over `CameraImage` frames (android, ios) apart
  # from one that cannot (web) — which is what decides whether the exam screen may
  # call `startImageStream` at all. Already a transitive dependency of `camera`;
  # named here because this package imports it.
  camera_platform_interface: ^2.13.1
  google_mlkit_face_detection: ^0.15.1

  # Microphone: audio loudness (dBFS) monitoring
  record: ^7.1.1

  # Permissions & lifecycle
  permission_handler: ^11.3.1

  # Browser-level exam guards
  web: ^1.1.1

  # Utils
  equatable: ^2.0.5

  # The font asset behind `CupertinoIcons`. Nothing in `lib/` names a Cupertino
  # icon directly, but the Flutter framework's own selection/adaptive widgets do,
  # and without this package a `flutter build` ends on
  # "Expected to find fonts for (MaterialIcons, packages/cupertino_icons/CupertinoIcons),
  # but found (MaterialIcons)" — i.e. those glyphs have no font to come from on
  # iOS and in the web build, and render as blank boxes. It is part of Flutter's
  # own app template for exactly this reason; the font is tree-shaken to the
  # glyphs actually referenced.
  cupertino_icons: ^1.0.8

  # Bulk student roster (admin): `file_picker` reads the .csv the administrator
  # chooses, `csv` parses it. Both are pure Dart/web-safe, so the upload page
  # works in the browser build as well as on the desktop and mobile apps.
  csv: ^8.0.0
  file_picker: ^12.3.0

  # Crash reporting, and **off unless a build passes
  # `--dart-define=SENTRY_DSN=...`** (`lib/core/services/crash_reporting.dart`).
  # Nothing else depends on it: without a DSN the SDK is never initialised, and
  # an init that throws is caught so an observability tool cannot keep a student
  # out of an exam. Reports carry no screenshot, view hierarchy or PII.
  #
  # Pinned to 9.x on purpose. `sentry_flutter` 10.x ships an Android plugin whose
  # `minSdkVersion` is 26, and this app keeps Flutter's floor of 24
  # (`android/app/build.gradle.kts`: `minSdk = flutter.minSdkVersion`) so that an
  # Android 7 phone can still sit an exam. 9.x declares 21, so nothing is lost.
  # Upgrading to 10.x is a decision to raise that floor, not a version bump.
  #
  # The floor is 9.30.1, not 9.0.0, because 9.0.0 cannot be built by the current
  # toolchain (Flutter 3.44, AGP 9.0.1, Kotlin 2.3.20, Xcode 26):
  #
  #   * Android: 9.0.0's `android/build.gradle` pins
  #     `kotlinOptions.languageVersion = "1.6"`. Kotlin 2.x dropped 1.6 support, so
  #     the plugin fails with "Language version 1.6 is no longer supported". 9.3.0
  #     moved it to 1.8 and 9.28.0 removed the pin altogether, also skipping the
  #     `kotlin-android` plugin when AGP 9 applies Kotlin itself (it reads
  #     `android.builtInKotlin`, which this project sets to `false` in
  #     `android/gradle.properties`, so the standalone plugin is still applied).
  #   * iOS: 9.0.0's podspec pins `Sentry/HybridSDK 8.51.0`, which does not compile
  #     with Xcode 26 (`SentryBinaryImageCache`). The Xcode 26 build fix landed in
  #     sentry-cocoa 8.53.0; 9.30.1 pins 8.58.4.
  #
  # One Flutter warning is still printed on an Android build, and it is expected:
  #
  #   WARNING: Your app uses the following plugins that apply Kotlin Gradle
  #   Plugin (KGP): sentry_flutter
  #
  # That is `android.builtInKotlin=false` doing exactly what it says: the template
  # keeps the standalone Kotlin plugin, and 9.30.1 is written for that path. It
  # warns about a *future* Flutter release, not this one - `flutter build apk`
  # succeeds with it, and so does a from-scratch `:sentry_flutter:compileDebugKotlin`
  # under AGP 9.0.1 + Kotlin 2.3.20. Dropping the warning is the same decision as
  # moving to 10.x (authored for built-in Kotlin, and minSdk 26), not a flag flip.
  #
  # `^9.30.1` stays inside 9.x, so `pub upgrade` cannot silently cross onto the
  # 10.x minSdk floor above.
  sentry_flutter: ^9.30.1

  # Google Fonts, **with runtime fetching switched off in `main()`**
  # (`GoogleFonts.config.allowRuntimeFetching = false`). The package is the only
  # way the app can name a Google Font, and that flag is what keeps it from
  # resolving one over the network at runtime: with it off a face must be
  # declared as an asset in this file (see
  # https://pub.dev/packages/google_fonts#bundling-of-font-assets), and asking
  # for one that is not bundled throws instead of downloading it. That is the
  # whole point for the browser build: a face fetched from Dart *is* an XHR, so
  # it is `connect-src` that would govern it, and the policy in `web/index.html`
  # carries `fonts.gstatic.com` there for the *engine's* fallback downloader
  # only - not for this package. `fonts.googleapis.com` is `style-src`
  # (stylesheet) and `fonts.gstatic.com` is also `font-src` (the `@font-face`
  # files that stylesheet names). Nothing in `lib/` calls `GoogleFonts` today;
  # `test/web_csp_contract_test.dart` pins the policy so the directive cannot
  # quietly grow back.
  google_fonts: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  http: ^1.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  ios: false
  # The browser build installs as a home-screen app off the same artwork, so it
  # is generated from the same file as the launcher icon: `web/icons/Icon-*.png`
  # and `web/favicon.png` are the four icons `web/manifest.json` and
  # `web/index.html` point at. Regenerate with
  # `dart run flutter_launcher_icons` after changing `app_icon.png` - the stock
  # Flutter logo in those files is what a custom-domain install shows otherwise
  # (`test/web_manifest_contract_test.dart` catches a manifest that points
  # somewhere else, and a favicon too big to be a favicon).
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#14284B"
    theme_color: "#3F51B5"