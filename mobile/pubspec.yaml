name: proctorguard
description: Cross-platform AI exam proctoring app (Flutter + Supabase + ML Kit)
publish_to: "none"
version: 1.0.0

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Backend
  supabase_flutter: ^2.5.6

  # Offline resilience: the local-first answer cache and the retry queues behind it
  shared_preferences: ^2.5.5

  # Desktop Window & Fullscreen Control
  window_manager: ^0.5.2

  # Camera / on-device AI
  camera: ^0.12.1
  google_mlkit_face_detection: ^0.15.1

  # Microphone: audio loudness (dBFS) monitoring
  record: ^7.1.1

  # Permissions & lifecycle
  permission_handler: ^11.3.1

  # Browser-level exam guards
  web: ^1.1.1

  # Utils
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  http: ^1.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  ios: false