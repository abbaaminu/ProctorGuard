name: proctorguard
description: Cross-platform AI exam proctoring app (Flutter + Supabase + ML Kit)
publish_to: "none"
version: 1.0.0

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Backend
  supabase_flutter: ^2.5.6

  # Offline resilience: the local-first answer cache and the retry queues behind it
  shared_preferences: ^2.5.5

  # Desktop Window & Fullscreen Control
  window_manager: ^0.5.2

  # Camera / on-device AI
  camera: ^0.12.1
  # The camera plugin's platform interface, imported directly for
  # `CameraPlatform.instance.supportsImageStreaming()`. That one question is what
  # tells a platform that can hand over `CameraImage` frames (android, ios) apart
  # from one that cannot (web) — which is what decides whether the exam screen may
  # call `startImageStream` at all. Already a transitive dependency of `camera`;
  # named here because this package imports it.
  camera_platform_interface: ^2.13.1
  google_mlkit_face_detection: ^0.15.1

  # Microphone: audio loudness (dBFS) monitoring
  record: ^7.1.1

  # Permissions & lifecycle
  permission_handler: ^11.3.1

  # Browser-level exam guards
  web: ^1.1.1

  # Utils
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  http: ^1.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  ios: false
  # The browser build installs as a home-screen app off the same artwork, so it
  # is generated from the same file as the launcher icon: `web/icons/Icon-*.png`
  # and `web/favicon.png` are the four icons `web/manifest.json` and
  # `web/index.html` point at. Regenerate with
  # `dart run flutter_launcher_icons` after changing `app_icon.png` - the stock
  # Flutter logo in those files is what a custom-domain install shows otherwise
  # (`test/web_manifest_contract_test.dart` catches a manifest that points
  # somewhere else, and a favicon too big to be a favicon).
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#14284B"
    theme_color: "#3F51B5"