name: Sync Release Artifacts (ProctorGuard)

# =============================================================================
# Builds the student app in release mode and mirrors *only* its installable
# output into the separate distribution repository:
#
#     https://github.com/abbaaminu/proctorguard-release
#
# What crosses that boundary: the three split-per-ABI release APKs, their SHA-256
# checksums (`apk/SHA256SUMS.txt`), a machine-readable `latest.json` (version,
# build number, commit, checksums) and a generated `README.md` for whoever
# downloads the app. Nothing else - no Dart, no SQL, no `android/`, no keystore,
# and no R8 `mapping.txt` (that one stays in this private repository, see the
# upload step; it is both the only way to read a crash report from a student's
# phone *and* a full class-name listing of a proctoring client).
#
# The source repository is read-only input for this workflow: `permissions:
# contents: read` leaves the job with a GITHUB_TOKEN that cannot push, the mirror
# is cloned into `$RUNNER_TEMP` (outside the checkout), and the only push it makes
# is the one authenticated with `RELEASE_PAT`.
#
# Required secrets (Settings -> Secrets and variables -> Actions):
#
#   RELEASE_PAT                Fine-grained PAT with `Contents: Read and write` on
#                              `abbaaminu/proctorguard-release` only (a classic
#                              token needs `repo`). It clones that one repository
#                              and pushes that one commit, nothing else.
#   SUPABASE_URL               Project URL, compiled into the APK by --dart-define.
#   SUPABASE_PUBLISHABLE_KEY   The PUBLIC anon/publishable key. Never service_role
#                              and never `sb_secret_...`: a secret key in a client
#                              build hands out full database access.
#   ANDROID_KEYSTORE_BASE64    Base64 of the upload keystore, e.g. in PowerShell:
#                                [Convert]::ToBase64String([IO.File]::ReadAllBytes('upload-keystore.jks'))
#   ANDROID_KEYSTORE_PASSWORD  Its store password.
#   ANDROID_KEY_ALIAS          Its key alias (e.g. `upload`).
#   ANDROID_KEY_PASSWORD       That key's password.
#
# The four keystore secrets are not optional. `android/app/build.gradle.kts`
# refuses to build a release signed with the *public* Android debug key - anyone
# can forge an "upgrade" of such an APK, camera permission and kiosk pin included
# - so a run without them stops with the keytool instructions instead of mirroring
# an APK a student could be tricked into installing.
#
# Each release adds ~90 MB of APKs to the mirror (the splits are 27-35 MB each).
# The newest build always replaces the same file names; older builds stay
# reachable through the mirror's Git history and through this repository's private
# artifacts (90 days).
# =============================================================================

on:
  # Every push to main mirrors the newest build; a `vX.Y.Z` tag publishes the same
  # commit under the tag's version instead of pubspec's.
  push:
    branches: [main]
    tags: ['v*']
  # Manual re-runs, e.g. the first run after the signing secrets are added.
  workflow_dispatch:

# The source repository is read-only here: nothing in this job can write to it.
permissions:
  contents: read

# One sync at a time across every ref: a branch push and a tag push on the same
# commit would otherwise race to publish two different trees to the same mirror.
# Newest build wins, as in `flutter_ci.yml`.
concurrency:
  group: release-sync
  cancel-in-progress: true

env:
  RELEASE_REPOSITORY: abbaaminu/proctorguard-release
  # Where `flutter build apk` leaves its output; `build_apk.ps1` reads the same
  # directory on a developer machine.
  APK_DIR: ${{ github.workspace }}/mobile/build/app/outputs/flutter-apk
  # R8's mapping file. Private run only - see the header.
  MAPPING_FILE: ${{ github.workspace }}/mobile/build/app/outputs/mapping/release/mapping.txt
  # Staging area: its contents are exactly what lands in the mirror.
  DIST_DIR: ${{ github.workspace }}/dist

jobs:
  build_and_publish:
    name: build the release APKs and mirror them
    runs-on: ubuntu-latest
    # The project's own cold `assembleRelease` took 33 minutes on a developer
    # machine (mobile/build-smoke.log); a runner with a cold Gradle cache is slower
    # still, so leave room instead of the 6-hour default.
    timeout-minutes: 90
    # A fork has no RELEASE_PAT - and must not be able to write to the mirror even
    # if it somehow had one.
    if: github.repository == 'abbaaminu/ProctorGuard'
    # Every Flutter/Dart command runs from `mobile/`; the publish steps below set
    # `working-directory` explicitly because they run outside the checkout.
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out the private source repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # `android/app/build.gradle.kts` pins source/target compatibility and
          # `jvmTarget` to 17, and the wrapper runs Gradle 9.1; pinning the JDK here
          # keeps a runner-image update from silently changing what R8 reads.
          java-version: '17'
          # Caches ~/.gradle: the Gradle distribution and the ML Kit / AndroidX
          # dependencies dominate a cold release build.
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show the toolchain (informational)
        run: flutter --version && flutter doctor -v
        continue-on-error: true

      - name: Install dependencies
        run: flutter pub get

      # The gate `flutter_ci.yml` applies to every push runs here too, so a mirrored
      # APK is never built from a commit that would have failed CI. Delete these two
      # steps if release runs matter more than that guarantee.
      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # Both values are compiled into the APK (`SupabaseConfig.fromEnvironment`), so
      # they have to be right *before* the build: a placeholder URL would otherwise
      # ship as an app that boots and then cannot reach any backend. The rules mirror
      # `mobile/supabase_defines.ps1`.
      - name: Check the Supabase secrets before they are compiled in
        working-directory: ${{ github.workspace }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          # `SUPABASE_ANON_KEY` is still accepted as the older name, exactly as the
          # app falls back to it.
          url="${SUPABASE_URL:-}"
          key="${SUPABASE_PUBLISHABLE_KEY:-}"
          [ -n "$key" ] || key="${SUPABASE_ANON_KEY:-}"

          placeholders='your-url|your_url|yourkey|your-key|your-anon-key|your-publishable-key|your-project|replace-me|replace_me|changeme|change-me'
          if [ -z "$url" ] || [[ "${url,,}" =~ $placeholders ]]; then
            echo "::error::SUPABASE_URL secret is unset or still a placeholder. Set it to https://<project-ref>.supabase.co."
            exit 1
          fi
          case "$url" in
            http://*|https://*) ;;
            *) echo "::error::SUPABASE_URL must start with http:// or https:// (got '$url')."; exit 1 ;;
          esac

          if [ -z "$key" ]; then
            echo "::error::SUPABASE_PUBLISHABLE_KEY secret is unset. Use the public anon/publishable key, never the service_role key."
            exit 1
          fi
          if [ "${#key}" -lt 20 ]; then
            echo "::warning::The Supabase key is only ${#key} characters - double-check that the secret holds the whole value."
          fi
          case "$key" in
            sb_secret_*)
              echo "::error::SUPABASE_PUBLISHABLE_KEY looks like a *secret* key (sb_secret_...): a secret key in a client build grants full database access. Use the publishable/anon key."
              exit 1
              ;;
          esac

          # Handed to the build step through the environment - never to a file, and
          # never to the log (`$GITHUB_ENV` is discarded with the runner).
          {
            echo "SUPABASE_URL=${url%/}"
            echo "SUPABASE_PUBLISHABLE_KEY=$key"
          } >> "$GITHUB_ENV"

      # `android/app/build.gradle.kts` refuses to build a release signed with the
      # public Android debug key, so the keystore is rebuilt from secrets here. On a
      # developer machine the same two files come from the keytool step documented in
      # `mobile/README.md`.
      - name: Rebuild the release keystore from its secrets
        working-directory: ${{ github.workspace }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          keystore="$GITHUB_WORKSPACE/mobile/upload-keystore.jks"
          properties="$GITHUB_WORKSPACE/mobile/android/key.properties"

          missing=""
          [ -n "${KEYSTORE_BASE64:-}" ]   || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "${KEYSTORE_PASSWORD:-}" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "${KEY_ALIAS:-}" ]         || missing="$missing ANDROID_KEY_ALIAS"
          [ -n "${KEY_PASSWORD:-}" ]      || missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            printf '::error::Refusing to build a release signed with the public Android debug key. Missing secret(s):%s\n' "$missing"
            cat >&2 <<'EOF'

          Anyone can sign an "upgrade" of an APK built with that key - camera
          permission, kiosk pin and all - and hand it to a student. Add these
          repository secrets (Settings -> Secrets and variables -> Actions):

            ANDROID_KEYSTORE_BASE64      base64 of the .jks, e.g. in PowerShell:
                                         [Convert]::ToBase64String([IO.File]::ReadAllBytes('upload-keystore.jks'))
            ANDROID_KEYSTORE_PASSWORD    the store password
            ANDROID_KEY_ALIAS            the key alias (e.g. upload)
            ANDROID_KEY_PASSWORD         the key password

          The keystore is generated once, from mobile/android/:

            keytool -genkey -v -keystore upload-keystore.jks -storetype JKS \
              -keyalg RSA -keysize 2048 -validity 10000 -alias upload

          Keep the .jks and its passwords out of both repositories.
          EOF
            exit 1
          fi

          # Drop the whitespace a pasted secret can carry before decoding.
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n\t ' | base64 --decode > "$keystore"

          # Prove the keystore opens *now*, with the alias and passwords Gradle will
          # use: a typo otherwise surfaces minutes into `assembleRelease` as a signing
          # failure with a far less obvious message.
          if ! keytool -list -keystore "$keystore" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null; then
            echo "::error::The keystore from ANDROID_KEYSTORE_BASE64 does not open with ANDROID_KEYSTORE_PASSWORD and alias '$KEY_ALIAS'."
            exit 1
          fi

          # The shape `key.properties.example` documents: `storeFile` resolves against
          # `mobile/android/`, so the keystore sits beside that directory. Both paths
          # are git-ignored, and this checkout is discarded with the runner.
          {
            printf 'storeFile=../upload-keystore.jks\n'
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > "$properties"

          echo "Signing material staged: $properties (with $keystore)."

      # What the APK metadata, `latest.json` and the mirror's README carry. A
      # `vX.Y.Z` tag is the release's own name for itself; every other ref keeps
      # pubspec's version.
      - name: Work out the version and build number for this run
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail

          # Android upgrades want a versionCode that only ever grows, so the build
          # number is this workflow's own run number: per-workflow and monotonic. A
          # fresh install does not care; an upgrade over an installed build does.
          build_number="$GITHUB_RUN_NUMBER"

          build_name="$(sed -n 's/^version:[[:space:]]*//p' mobile/pubspec.yaml | head -n1 | cut -d'+' -f1 | tr -d '[:space:]')"
          if [ -z "$build_name" ]; then
            echo "::error::No 'version:' found in mobile/pubspec.yaml."
            exit 1
          fi

          tag=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            candidate="${GITHUB_REF_NAME#v}"
            if [[ "$candidate" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
              build_name="$candidate"
              tag="$GITHUB_REF_NAME"
            else
              echo "::warning::Tag $GITHUB_REF_NAME is not vX.Y.Z; building as version $build_name."
            fi
          fi

          {
            echo "RELEASE_BUILD_NAME=$build_name"
            echo "RELEASE_BUILD_NUMBER=$build_number"
            echo "RELEASE_TAG=$tag"
          } >> "$GITHUB_ENV"

          echo "Publishing $build_name (build $build_number) from $GITHUB_REF."

      # The command `mobile/build_apk.ps1` wraps, plus the two values that script
      # resolves from parameters or the environment.
      - name: Build the release APKs (three ABIs, R8 shrinking, real signing)
        run: |
          set -euo pipefail

          # `--split-per-abi` on purpose: a single `--target-platform android-arm64`
          # build still carries the plugins' armeabi-v7a and x86_64 `.so` files while
          # holding `libflutter.so`/`libapp.so` for arm64 only, so a 32-bit phone
          # installs it happily and then crashes on startup (mobile/README.md).
          #
          # No `--dart-define=MOCK_CAMERA` and no `AUDIO_MONITORING=false`: both
          # switches exist for `flutter run`, and their defaults - real detection, mic
          # monitoring on - are exactly what a release has to keep.
          #
          # The Gradle daemon heap is left at the 2G in `android/gradle.properties`,
          # which is the setting behind the 27-35 MB splits in mobile/build-smoke.log.
          flutter build apk --release --split-per-abi \
            --build-name="$RELEASE_BUILD_NAME" \
            --build-number="$RELEASE_BUILD_NUMBER" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      # Nothing is mirrored that has not been looked at: three splits, each with its
      # own engine and no other ABI's, before a single byte is staged.
      - name: Collect and verify the built APKs
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          dist="$DIST_DIR"
          rm -rf "$dist"
          mkdir -p "$dist/apk"

          apks=( "$APK_DIR"/*-release.apk )
          if [ "${#apks[@]}" -ne 3 ]; then
            echo "::error::Expected three per-ABI release APKs in $APK_DIR, found ${#apks[@]}. A partial build is not something to publish."
            ls -l "$APK_DIR" || true
            exit 1
          fi

          check_abi() {
            local file="$1" abi="$2" listing other
            # Read the listing once and match it with grep instead of piping into
            # `grep -q`: under `pipefail`, a SIGPIPE from `unzip -l` would fail this
            # check for no reason at all.
            listing="$(unzip -l "$file")"
            if ! grep -qF "lib/$abi/libflutter.so" <<< "$listing"; then
              echo "::error::$(basename "$file") has no lib/$abi/libflutter.so - it is not the $abi build."
              exit 1
            fi
            for other in arm64-v8a armeabi-v7a x86_64; do
              [ "$other" = "$abi" ] && continue
              if grep -qF "lib/$other/libflutter.so" <<< "$listing"; then
                echo "::error::$(basename "$file") also carries lib/$other/libflutter.so, so a $other phone would install it and crash on startup."
                exit 1
              fi
            done
            return 0
          }

          for apk in "${apks[@]}"; do
            size="$(stat -c %s "$apk")"
            # The three splits are 27-35 MB (mobile/build-smoke.log); a few hundred
            # kilobytes means the build produced a stub, not an app.
            if [ "$size" -lt 5242880 ]; then
              echo "::error::$(basename "$apk") is only $((size / 1048576)) MB - refusing to mirror a stub."
              exit 1
            fi
            cp "$apk" "$dist/apk/"
            printf '  %-34s %s MB\n' "$(basename "$apk")" "$((size / 1048576))"
          done

          check_abi "$dist/apk/app-arm64-v8a-release.apk"   arm64-v8a
          check_abi "$dist/apk/app-armeabi-v7a-release.apk" armeabi-v7a
          check_abi "$dist/apk/app-x86_64-release.apk"      x86_64

          # Relative names, so the checksums verify from inside `apk/`.
          ( cd "$dist/apk" && sha256sum ./*.apk > SHA256SUMS.txt )
          cat "$dist/apk/SHA256SUMS.txt"

      # `dist/` becomes the mirror's new contents: the APKs, their checksums, a
      # machine-readable manifest, and a README for whoever downloads the app.
      #
      # Note the heredoc bodies below sit flush left with the rest of the script: a
      # block scalar strips the common indent, and markdown that came out indented
      # would render as one code block.
      - name: Write the mirror's README and manifest
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail

          dist="$DIST_DIR"
          built_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          short_sha="${GITHUB_SHA:0:7}"

          # APKs are binary blobs; the text files are read by humans and by updaters.
          cat > "$dist/.gitattributes" <<'EOF'
          *.apk binary
          *.md text eol=lf
          *.json text eol=lf
          *.txt text eol=lf
          EOF

          # The download page. The static markdown comes from a *quoted* heredoc so its
          # backticks and `$` survive untouched; the provenance table below is what
          # carries this run's values.
          cat > "$dist/README.md" <<'MARKDOWN'
          # ProctorGuard - release downloads

          **This repository holds built artifacts only.** It is written by the release
          workflow of the private ProctorGuard repository: the application's source
          code, database schema and signing material are not here and never will be.

          ## Install on an Android phone

          1. Download the APK that matches the phone's CPU:
             - `apk/app-arm64-v8a-release.apk` - every modern phone (pick this if unsure)
             - `apk/app-armeabi-v7a-release.apk` - older 32-bit phones
             - `apk/app-x86_64-release.apk` - x86 emulators, a few tablets
          2. Allow installing from the browser or the file manager when Android asks
             ("Install unknown apps" for that app).
          3. Install it, then sign in with the account the school issued.

          With `adb`, the newest build installs over an older one without losing data:

          ```sh
          adb install -r apk/app-arm64-v8a-release.apk
          ```

          ## Verify a download

          ```sh
          cd apk && sha256sum -c SHA256SUMS.txt
          ```

          Every APK is signed with the ProctorGuard upload key. A build from anywhere
          else - or one whose signature does not match an existing install - is not an
          official build: uninstall it rather than trusting it. The key is not in this
          repository.

          ## What is in here

          | path | what it is |
          | --- | --- |
          | `apk/*-release.apk` | the student app, one APK per CPU architecture |
          | `apk/SHA256SUMS.txt` | SHA-256 of each APK above |
          | `latest.json` | version, build number, commit and checksums of this build |

          The file names never change: this repository always carries the newest build
          from the private repository's `main`. Older builds stay reachable through this
          repository's Git history.
          MARKDOWN

          {
            printf '\n## This build\n\n'
            printf '| | |\n| --- | --- |\n'
            printf '| version | %s |\n' "$RELEASE_BUILD_NAME"
            printf '| build number | %s |\n' "$RELEASE_BUILD_NUMBER"
            printf '| commit | %s |\n' "$short_sha"
            if [ -n "$RELEASE_TAG" ]; then
              printf '| tag | %s |\n' "$RELEASE_TAG"
            else
              printf '| ref | %s |\n' "$GITHUB_REF_NAME"
            fi
            printf '| built | %s |\n' "$built_at"
          } >> "$dist/README.md"

          # `latest.json` is what an updater or a checker reads instead of guessing
          # from file names.
          files_json=""
          for apk in "$dist/apk"/*.apk; do
            name="$(basename "$apk")"
            digest="$(sha256sum "$apk" | cut -d' ' -f1)"
            size="$(stat -c %s "$apk")"
            [ -z "$files_json" ] || files_json+=","$'\n'
            files_json+="    { \"name\": \"$name\", \"sizeBytes\": $size, \"sha256\": \"$digest\" }"
          done

          tag_json="null"
          [ -z "$RELEASE_TAG" ] || tag_json="\"$RELEASE_TAG\""

          {
            printf '{\n'
            printf '  "version": "%s",\n' "$RELEASE_BUILD_NAME"
            printf '  "buildNumber": %s,\n' "$RELEASE_BUILD_NUMBER"
            printf '  "tag": %s,\n' "$tag_json"
            printf '  "commit": "%s",\n' "$GITHUB_SHA"
            printf '  "ref": "%s",\n' "$GITHUB_REF_NAME"
            printf '  "sourceRepository": "%s",\n' "$GITHUB_REPOSITORY"
            printf '  "builtAt": "%s",\n' "$built_at"
            printf '  "runId": %s,\n' "$GITHUB_RUN_ID"
            printf '  "files": [\n%s\n  ]\n' "$files_json"
            printf '}\n'
          } > "$dist/latest.json"

          # Nobody should ever pull half-written JSON from the mirror (jq ships with
          # the ubuntu-latest image).
          jq -e . "$dist/latest.json" > /dev/null
          find "$dist" -type f | sort

      # The APKs are kept here too, together with the R8 mapping that must not be
      # published. This step comes before the push on purpose: a run that cannot keep
      # `mapping.txt` - the only way to read a crash report from a student's phone, and
      # simultaneously a full class-name listing of a proctoring client - does not get
      # to publish a build at all.
      - name: Keep the APKs and the R8 mapping in this private run
        uses: actions/upload-artifact@v4
        with:
          name: proctorguard-apks-${{ github.run_number }}
          path: |
            dist/apk/*.apk
            mobile/build/app/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 90

      # --- the mirror ----------------------------------------------------------
      # Everything below runs outside the checkout: the source tree is input to this
      # job, never output. The mirror lives in `$RUNNER_TEMP`, which the runner
      # discards along with the token inside its `origin` URL.
      - name: Clone the release repository (or start it, if it is still empty)
        working-directory: ${{ runner.temp }}
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          set -euo pipefail

          if [ -z "${RELEASE_PAT:-}" ]; then
            echo "::error::The RELEASE_PAT secret is not set. Create a fine-grained PAT with 'Contents: Read and write' on $RELEASE_REPOSITORY and add it as a repository secret."
            exit 1
          fi

          # Never echoed: GitHub masks the value in the log anyway, and the URL only
          # ever reaches a file inside $RUNNER_TEMP.
          remote="https://x-access-token:${RELEASE_PAT}@github.com/${RELEASE_REPOSITORY}.git"

          rm -rf release-repo

          # `ls-remote` first, because with `--exit-code` its status separates the
          # cases that matter: 0 is "reachable, and it has branches"; 2 is "reachable,
          # but no branches yet" (a brand-new mirror); anything else is an expired
          # token, a wrong repository name or a missing permission - which must not be
          # mistaken for "empty" and then replaced.
          set +e
          git ls-remote --exit-code --heads "$remote" > /dev/null 2>&1
          probe=$?
          set -e

          case "$probe" in
            0)
              git clone --quiet --depth 1 "$remote" release-repo
              ;;
            2)
              echo "::notice::$RELEASE_REPOSITORY has no commits yet; this run creates the first one."
              git init --quiet --initial-branch=main release-repo
              git -C release-repo remote add origin "$remote"
              ;;
            *)
              echo "::error::Cannot reach $RELEASE_REPOSITORY with RELEASE_PAT (git ls-remote exited $probe). Check that the token has not expired and grants 'Contents: Read and write' on that repository."
              exit 1
              ;;
          esac

          cd release-repo
          echo "Mirror ready on branch '$(git symbolic-ref --short HEAD)'."

      - name: Copy only the release files into the mirror
        working-directory: ${{ runner.temp }}/release-repo
        run: |
          set -euo pipefail

          # Exactly the staged set, and nothing that was there before: the APK names
          # are stable across releases, so a stale file would silently linger.
          rm -rf apk README.md latest.json .gitattributes
          cp -R "$DIST_DIR/." .

          # The audit trail, in the log: this is every file the commit will contain.
          find . -path ./.git -prune -o -type f -print | sort

      - name: Commit and push to the mirror
        working-directory: ${{ runner.temp }}/release-repo
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail

          # The standard GitHub Actions bot identity: the mirror's history reads as
          # machine-made, not as somebody's commit.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          branch="$(git symbolic-ref --short HEAD)"
          git checkout --quiet -B "$branch"
          git add --all

          if git diff --cached --quiet; then
            echo "::notice::$RELEASE_REPOSITORY already matches $RELEASE_BUILD_NAME (build $RELEASE_BUILD_NUMBER); nothing to push."
            exit 0
          fi

          git commit --quiet \
            -m "Release $RELEASE_BUILD_NAME (build $RELEASE_BUILD_NUMBER)" \
            -m "Mirrored from $SOURCE_REPOSITORY@$SOURCE_SHA ($SOURCE_REF) by run $GITHUB_RUN_ID."

          # A shallow clone committed on top of the branch it cloned, so this is a
          # fast-forward of that same ref, authenticated with RELEASE_PAT.
          git push --quiet origin "$branch"

          git --no-pager log -1 --stat --format='%h %an <%ae>%n%n%B'
          echo "::notice::Published to https://github.com/$RELEASE_REPOSITORY (branch $branch)."

      - name: Summarise the run
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail

          if [ ! -f "$DIST_DIR/latest.json" ]; then
            echo "No release was staged: the job stopped before the build produced APKs." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "## ProctorGuard ${RELEASE_BUILD_NAME:-unknown} (build ${RELEASE_BUILD_NUMBER:-?})"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| commit | \`$GITHUB_SHA\` |"
            echo "| mirror | \`$RELEASE_REPOSITORY\` |"
            echo "| files | $(cd "$DIST_DIR/apk" && ls | tr '\n' ' ') |"
          } >> "$GITHUB_STEP_SUMMARY"
