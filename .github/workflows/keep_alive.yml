name: Keep Supabase Alive (ProctorGuard)

on:
  schedule:
    # Runs twice a day (at 00:00 and 12:00 UTC) to guarantee at least one successful daily ping
    - cron: '0 0,12 * * *'
  workflow_dispatch: # Allows you to manually trigger it anytime for testing

jobs:
  ping_supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive query to Supabase REST API
        run: |
          echo "Sending live query to Supabase..."

          # The probe asks `profiles`, not the student question feed:
          # `questions_public` is granted to `authenticated` only (schema.sql §3
          # revokes the blanket grant from `anon`), so the anonymous keep-alive
          # key gets a 401 there by design. `profiles` answers 200 with an empty
          # array instead - `anon` has no policy on it, and an empty array is RLS
          # doing its job rather than a refused query - which is all this needs:
          # one statement actually executed against the database.
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}")

          # Separate the body and status code for debugging
          BODY=$(echo "$RESPONSE" | sed '/HTTP_STATUS:/d')
          STATUS=$(echo "$RESPONSE" | tr -d '\r' | sed -n 's/.*HTTP_STATUS:\([0-9]*\)/\1/p')

          echo "HTTP Status Code: $STATUS"
          echo "API Response: $BODY"

          # Check if the database request was successful (200 OK)
          if [ "$STATUS" -eq 200 ]; then
            echo "✅ Success: Database activity recorded."
          else
            echo "❌ Error: API request failed with status $STATUS. Check the project's schema grants (§0/§3 of supabase/schema.sql) and the table name."
            exit 1
          fi
