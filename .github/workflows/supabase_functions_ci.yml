name: Supabase Functions CI (ProctorGuard)

# The Edge Functions are Deno, so `flutter test` never sees them and
# `sync_release.yml` only bundles them at the very end. `npm run typecheck`
# (`supabase/functions`) is the one gate that catches a mis-resolved import or an
# argument-name drift *before* `supabase functions deploy` decides the answer on
# a live project. It needs no Supabase project, no secrets and no service-role
# key - only npm and the checked-in `package-lock.json`.
#
# It is also what keeps the functions on the `npm:` specifiers:
# `admin-reset-password` used to import `https://esm.sh/@supabase/supabase-js@2`,
# which Deno resolves at runtime but has no declaration for the TypeScript
# checker (TS2307), so a checkout failed `npm run typecheck` while `deploy` was
# happy. `npm-imports.d.ts` declares the `npm:` form for exactly this reason.
#
# No `paths:` filter, deliberately: it runs on every push and pull request like
# `flutter_ci.yml`, so it behaves predictably if it is ever made a required
# check - a path-filtered workflow never reports on a PR that does not touch its
# paths, and a required check that never reports blocks the merge.
on:
  push:
  pull_request:

concurrency:
  group: supabase-functions-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: tsc (Deno types, no deployment)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: supabase/functions/package-lock.json

      - name: Install dev dependencies
        run: npm ci

      # Zero errors is the gate; `tsc` exits non-zero on the first TS2307/TS2345
      # it finds, and nothing is deployed or uploaded from here.
      - name: Type-check the Edge Functions
        run: npm run typecheck
