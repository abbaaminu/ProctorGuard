name: ProctorGuard Pipeline

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proctorguard-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  analyze_and_test:
    name: analyze + contract tests + suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Contract tests (schema + Android manifest)
        run: >
          flutter test
          test/schema_contract_test.dart
          test/android_manifest_contract_test.dart

      - name: Full test suite
        run: flutter test

  typecheck_supabase:
    name: tsc (Deno types, no deployment)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: supabase/functions/package-lock.json

      - name: Install dev dependencies
        run: npm ci

      - name: Type-check the Edge Functions
        run: npm run typecheck

  build_web:
    name: build (web release)
    needs: analyze_and_test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk/sample-index
          df -h

      - name: Install dependencies
        run: flutter pub get

      - name: Build web (release)
        run: >-
          flutter build web --release
          --dart-define=SUPABASE_URL=https://ci.invalid
          --dart-define=SUPABASE_PUBLISHABLE_KEY=ci-placeholder

  build_android_debug:
    name: build (Android debug)
    needs: analyze_and_test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk/sample-index
          df -h

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android (debug)
        run: >-
          flutter build apk --debug
          --dart-define=SUPABASE_URL=https://ci.invalid
          --dart-define=SUPABASE_PUBLISHABLE_KEY=ci-placeholder

  build_and_publish:
    name: build the release APKs and mirror them
    needs: analyze_and_test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: release-sync
      cancel-in-progress: true
    if: >-
      github.repository == 'abbaaminu/ProctorGuard' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))))
    env:
      RELEASE_REPOSITORY: abbaaminu/proctorguard-release
      APK_DIR: ${{ github.workspace }}/mobile/build/app/outputs/flutter-apk
      MAPPING_FILE: ${{ github.workspace }}/mobile/build/app/outputs/mapping/release/mapping.txt
      DIST_DIR: ${{ github.workspace }}/dist
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out the private source repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true

      - name: Show the toolchain (informational)
        run: flutter --version && flutter doctor -v
        continue-on-error: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Check the Supabase secrets before they are compiled in
        working-directory: ${{ github.workspace }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          url="${SUPABASE_URL:-}"
          key="${SUPABASE_PUBLISHABLE_KEY:-}"
          [ -n "$key" ] || key="${SUPABASE_ANON_KEY:-}"
          placeholders='your-url|your_url|yourkey|your-key|your-anon-key|your-publishable-key|your-project|replace-me|replace_me|changeme|change-me'
          if [ -z "$url" ] || [[ "${url,,}" =~ $placeholders ]]; then
            echo "::error::SUPABASE_URL secret is unset or still a placeholder."
            exit 1
          fi
          case "$url" in
            http://*|https://*) ;;
            *) echo "::error::SUPABASE_URL must start with http:// or https:// (got '$url')."; exit 1 ;;
          esac
          if [ -z "$key" ]; then
            echo "::error::SUPABASE_PUBLISHABLE_KEY secret is unset."
            exit 1
          fi
          case "$key" in
            sb_secret_*)
              echo "::error::SUPABASE_PUBLISHABLE_KEY looks like a secret key. Use the public anon key."
              exit 1
              ;;
          esac
          {
            echo "SUPABASE_URL=${url%/}"
            echo "SUPABASE_PUBLISHABLE_KEY=$key"
          } >> "$GITHUB_ENV"

      - name: Rebuild the release keystore from its secrets
        working-directory: ${{ github.workspace }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keystore="$GITHUB_WORKSPACE/mobile/upload-keystore.jks"
          properties="$GITHUB_WORKSPACE/mobile/android/key.properties"
          missing=""
          [ -n "${KEYSTORE_BASE64:-}" ]   || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "${KEYSTORE_PASSWORD:-}" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "${KEY_ALIAS:-}" ]         || missing="$missing ANDROID_KEY_ALIAS"
          [ -n "${KEY_PASSWORD:-}" ]      || missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            printf '::error::Missing Android keystore secret(s):%s\n' "$missing"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n\t ' | base64 --decode > "$keystore"
          if ! keytool -list -keystore "$keystore" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null; then
            echo "::error::Keystore failed to open with provided password and alias."
            exit 1
          fi
          {
            printf 'storeFile=../upload-keystore.jks\n'
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > "$properties"

      - name: Work out the version and build number for this run
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          build_number="$GITHUB_RUN_NUMBER"
          build_name="$(sed -n 's/^version:[[:space:]]*//p' mobile/pubspec.yaml | head -n1 | cut -d'+' -f1 | tr -d '[:space:]')"
          tag=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            candidate="${GITHUB_REF_NAME#v}"
            if [[ "$candidate" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
              build_name="$candidate"
              tag="$GITHUB_REF_NAME"
            fi
          fi
          {
            echo "RELEASE_BUILD_NAME=$build_name"
            echo "RELEASE_BUILD_NUMBER=$build_number"
            echo "RELEASE_TAG=$tag"
          } >> "$GITHUB_ENV"

      - name: Build the release APKs
        run: |
          set -euo pipefail
          flutter build apk --release --split-per-abi \
            --build-name="$RELEASE_BUILD_NAME" \
            --build-number="$RELEASE_BUILD_NUMBER" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      - name: Collect and verify the built APKs
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          dist="$DIST_DIR"
          rm -rf "$dist"
          mkdir -p "$dist/apk"
          apks=( "$APK_DIR"/*-release.apk )
          if [ "${#apks[@]}" -ne 3 ]; then
            echo "::error::Expected three per-ABI release APKs, found ${#apks[@]}."
            exit 1
          fi
          for apk in "${apks[@]}"; do
            cp "$apk" "$dist/apk/"
          done
          ( cd "$dist/apk" && sha256sum ./*.apk > SHA256SUMS.txt )

      - name: Write the mirror's README and manifest
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          dist="$DIST_DIR"
          built_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat > "$dist/README.md" <<'MARKDOWN'
          # ProctorGuard - release downloads
          This repository holds official built Android APKs.
          MARKDOWN
          files_json=""
          for apk in "$dist/apk"/*.apk; do
            name="$(basename "$apk")"
            digest="$(sha256sum "$apk" | cut -d' ' -f1)"
            size="$(stat -c %s "$apk")"
            [ -z "$files_json" ] || files_json+=","$'\n'
            files_json+="    { \"name\": \"$name\", \"sizeBytes\": $size, \"sha256\": \"$digest\" }"
          `done
          {
            printf '{\n'
            printf '  "version": "%s",\n' "$RELEASE_BUILD_NAME"
            printf '  "buildNumber": %s,\n' "$RELEASE_BUILD_NUMBER"
            printf '  "files": [\n%s\n  ]\n' "$files_json"
            printf '}\n'
          } > "$dist/latest.json"

      - name: Keep the APKs and the R8 mapping
        uses: actions/upload-artifact@v7
        with:
          name: proctorguard-apks-${{ github.run_number }}
          path: |
            dist/apk/*.apk
            mobile/build/app/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 90

      - name: Clone and Push to Release Repository
        working-directory: ${{ runner.temp }}
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_PAT:-}" ]; then
            echo "::error::RELEASE_PAT secret is missing."
            exit 1
          fi
          remote="https://x-access-token:${RELEASE_PAT}@github.com/${RELEASE_REPOSITORY}.git"
          temp_dir="release-repo"
          rm -rf "$temp_dir"
          git clone --quiet --depth 1 "$remote" "$temp_dir" || {
            git init --quiet --initial-branch=main "$temp_dir"
            git -C "$temp_dir" remote add origin "$remote"
          }
          cd "$temp_dir"
          rm -rf apk README.md latest.json
          cp -R "$DIST_DIR/." .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "Release repo already matches."
            exit 0
          fi
          git commit -m "Release $RELEASE_BUILD_NAME (build $RELEASE_BUILD_NUMBER)"
          git push origin "$(git symbolic-ref --short HEAD)"